<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Paree!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    background: radial-gradient(circle at top, #51317d, #160d2c 65%, #080512);
    color: white;
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(white 1px, transparent 1px),
      radial-gradient(#d8aaff 1px, transparent 1px);
    background-size: 55px 55px, 85px 85px;
    animation: sparkle 5s linear infinite;
}

@keyframes sparkle {
    from { transform: translateY(0); }
    to { transform: translateY(-85px); }
}

.card {
    position: relative;
    z-index: 2;
    width: 88%;
    max-width: 420px;
    padding: 45px 22px;
    text-align: center;
    border: 1px solid #d6a8ff;
    border-radius: 25px;
    background: rgba(35, 19, 58, 0.85);
    box-shadow: 0 0 35px #a34dff66;
    animation: appear 1.5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(40px) scale(.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.cake {
    font-size: 75px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    50% { transform: translateY(-12px); }
}

h1 {
    margin: 22px 0;
    font-size: 34px;
    color: #f2caff;
    text-shadow: 0 0 15px #c77dff;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    to { text-shadow: 0 0 30px #e5b6ff; }
}

p {
    font-size: 19px;
    letter-spacing: 1px;
    color: #f8eaff;
}

button {
    margin-top: 30px;
    padding: 13px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #b45cff, #f0a5ff);
    color: #261039;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px #c77dff88;
}

#surprise {
    display: none;
    margin-top: 25px;
    font-size: 18px;
    line-height: 1.7;
    color: #f4dfff;
}

.balloon {
    position: absolute;
    bottom: -120px;
    font-size: 45px;
    animation: float 9s linear infinite;
}

@keyframes float {
    to { transform: translateY(-120vh) rotate(20deg); }
}

.confetti {
    position: absolute;
    width: 8px;
    height: 12px;
    top: -20px;
    animation: fall 5s linear infinite;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">
    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <p>happy birthday paree 🫂</p>

    <button onclick="openSurprise()">Open your surprise ✨</button>

    <div id="surprise">
        Wishing you more happiness, blessings,
        good health, and unforgettable memories.
        Enjoy your special day, paree! 🎉
        <br><br>
        Keep shining and stay awesome!
    </div>
</div>

<script>
function openSurprise() {
    document.getElementById("surprise").style.display = "block";
    document.querySelector("button").innerText = "Enjoy your day! 🎂";
}

const colors = ["#ffb7ff", "#d7a5ff", "#ffffff", "#b56aff"];

for (let i = 0; i < 45; i++) {
    let confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = colors[Math.floor(Math.random()*colors.length)];
    confetti.style.animationDelay = Math.random() * 5 + "s";
    confetti.style.animationDuration = (3 + Math.random() * 5) + "s";
    document.body.appendChild(confetti);
}

for (let i = 0; i < 10; i++) {
    let balloon = document.createElement("div");
    balloon.className = "balloon";
    balloon.innerHTML = "🎈";
    balloon.style.left = Math.random() * 100 + "vw";
    balloon.style.animationDelay = Math.random() * 8 + "s";
    document.body.appendChild(balloon);
}
</script>

</body>
</html>
